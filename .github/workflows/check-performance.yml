name: Check 0.51.0 performance add-on
on:
  push:
    branches: ['optimize/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Test the actual add-on with UIKit stand-ins
        run: |
          mkdir -p out
          xcrun clang -fobjc-arc -DSG_PERFORMANCE_TEST -Wall -Wextra -Werror \
            tests/performance-main.m performance/SGPerformance.m performance/SGPerfSettings.m -framework Foundation -o out/performance-tests
          out/performance-tests
          out/performance-tests inactive
          out/performance-tests background
          out/performance-tests unsupported-ticker
          out/performance-tests unsupported-settings
          out/performance-tests unsupported-cover
          out/performance-tests light-mode-seeded
          out/performance-tests automatic-seeded-power
          out/performance-tests automatic-seeded-thermal
          out/performance-tests automatic-seeded-fair
      - name: Test guarded 0.51.0 lyrics repairs
        run: |
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('vendor/releases/0.51.0/spoti.pw-0.51.0-kit.zip') as kit:
              names = [n for n in kit.namelist() if n.endswith('/spotifyglass.dylib') or n == 'spotifyglass.dylib']
              assert len(names) == 1, names
              open('out/original-core.dylib', 'wb').write(kit.read(names[0]))
          PYTHON
          xcrun clang -fobjc-arc -Os -Wall -Wextra -Werror tests/lyrics-repair-main.m -framework Foundation -o out/lyrics-repair-tests
          out/lyrics-repair-tests out/original-core.dylib
      - name: Build the iOS add-on
        run: scripts/build-performance.sh
      - name: Install real IPA packaging tools
        run: |
          brew install ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git@740d3716dcd98c20c000f12cdb88f1f0b2a533a4
      - name: Package official and optimized 0.51.0 for both supported Spotify versions
        env:
          SG_OFFICIAL_KIT: ${{ github.workspace }}/vendor/releases/0.51.0/spoti.pw-0.51.0-kit.zip
          SG_PERFORMANCE_DYLIB: ${{ github.workspace }}/out/SGPerformance051.dylib
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v5
        with:
          name: SGPerformance051
          path: out/SGPerformance051.dylib
